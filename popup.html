<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="cf-logo">CF</div>
      <span class="header-title">CleanFeed</span>
    </div>
    <div class="header-badge" id="planBadge">FREE</div>
  </div>

  <!-- Stats Row -->
  <div class="stats-row">
    <div class="stat">
      <div class="stat-value" id="statBlocked">0</div>
      <div class="stat-label" data-i18n="blocked">Blocked</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-value" id="statHidden">0</div>
      <div class="stat-label" data-i18n="hidden">Hidden</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-value" id="statInterests">0</div>
      <div class="stat-label" data-i18n="interests">Interests</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tab-bar">
    <button class="tab active" data-tab="controls" data-i18n="controls">Controls</button>
    <button class="tab" data-tab="blocked" data-i18n="blocked">Blocked</button>
    <button class="tab" data-tab="interests">
      <span data-i18n="interests">Interests</span>
      <span class="pro-badge" id="interestsProBadge">PRO</span>
    </button>
  </div>

  <!-- Tab Content: Controls -->
  <div class="tab-content active" id="tab-controls">
    <div class="toggle-item">
      <div class="toggle-info">
        <div class="toggle-title" data-i18n="searchOnlyMode">Search-Only Mode</div>
        <div class="toggle-desc" data-i18n="searchOnlyDesc">Hide homepage feed completely</div>
      </div>
      <div class="toggle-switch" id="toggleSearchOnly">
        <div class="toggle-knob"></div>
      </div>
    </div>

    <div class="toggle-item">
      <div class="toggle-info">
        <div class="toggle-title">
          <span data-i18n="interestBoundaries">Interest Boundaries</span>
          <span class="pro-badge-inline" id="ibProBadge">PRO</span>
        </div>
        <div class="toggle-desc" data-i18n="interestBoundariesDesc">Ask before adding new interests</div>
      </div>
      <div class="toggle-switch" id="toggleInterestBoundaries">
        <div class="toggle-knob"></div>
      </div>
    </div>

    <div class="toggle-item">
      <div class="toggle-info">
        <div class="toggle-title">
          <span data-i18n="smartDecay">Smart Decay</span>
          <span class="pro-badge-inline" id="sdProBadge">PRO</span>
        </div>
        <div class="toggle-desc" data-i18n="smartDecayDesc">Auto-remove interests after 30 days</div>
      </div>
      <div class="toggle-switch" id="toggleSmartDecay">
        <div class="toggle-knob"></div>
      </div>
    </div>

    <!-- Upgrade CTA (free users only) -->
    <div class="upgrade-cta" id="upgradeCta">
      <div class="upgrade-title" data-i18n="unlockFeatures">Unlock all features</div>
      <div class="upgrade-subtitle">Interest Boundaries + Smart Decay + Stats</div>
      <button class="upgrade-btn" id="upgradeBtn" data-i18n="upgradeToPro">Upgrade to Pro — $3.99/mo</button>
    </div>
  </div>

  <!-- Tab Content: Blocked -->
  <div class="tab-content" id="tab-blocked">
    <div class="blocked-list" id="blockedList"></div>
    <button class="clear-all-btn" id="clearAllBtn" data-i18n="clearAll">Clear All Blocks</button>
  </div>

  <!-- Tab Content: Interests -->
  <div class="tab-content" id="tab-interests">
    <div class="interests-list" id="interestsList"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
