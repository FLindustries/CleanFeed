<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="cf-logo">
        <svg width="13" height="11" viewBox="0 0 13 11" fill="none" aria-hidden="true">
          <rect x="0" y="0" width="13" height="2.2" rx="1.1" fill="white"/>
          <rect x="2" y="4.2" width="9" height="2.2" rx="1.1" fill="white"/>
          <rect x="4.5" y="8.4" width="4" height="2.2" rx="1.1" fill="white"/>
        </svg>
      </div>
      <span class="header-title">CleanFeed</span>
    </div>
    <div class="header-right">
      <div class="header-badge" id="planBadge">FREE</div>
      <button class="header-settings-btn" id="openOptionsBtn" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab active" data-tab="controls" data-i18n="controls">Controls</button>
    <button class="tab" data-tab="blocked" data-i18n="blocked">Blocked</button>
    <button class="tab" data-tab="hidden" data-i18n="hidden">Hidden</button>
    <button class="tab" data-tab="interests" data-i18n="interests" data-cf-feature="interestBoundaries">Interests</button>
  </div>

  <div class="tab-content active" id="tab-controls"></div>
  <div class="tab-content" id="tab-blocked"></div>
  <div class="tab-content" id="tab-hidden"></div>
  <div class="tab-content" id="tab-interests" data-cf-feature="interestBoundaries"></div>

  <script src="features.js"></script>
  <script src="content-dom.js"></script>
  <script src="popup.js"></script>
</body>
</html>
